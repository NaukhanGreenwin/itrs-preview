<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sample letter of attestation | IT Rapid Support</title>
<link rel="icon" href="../../brand/favicon.ico">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/inter-wght.woff2') format('woff2');font-weight:100 900;font-display:swap}
:root{--ink:#0b1420;--steel:#3e6e9e;--slate:#5b6573;--line:#dfe4ea;--mist:#f3f5f8;--body:#26303c;
--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#e6eaef}
body{margin:0;font-family:var(--sans);color:var(--body);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;font-variant-numeric:lining-nums tabular-nums}
.bar{position:sticky;top:0;z-index:5;background:#0b1420;color:#c9d3de}
.bar-in{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:13px}
.bar a{color:#fff;text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:40px}
.bar a:hover{text-decoration:underline}
.bar .lab{color:#8fb0cf;letter-spacing:.04em;text-transform:uppercase;font-size:11.5px;font-weight:600}
.bar .dl{border:1px solid rgba(255,255,255,.35);padding:0 14px;border-radius:2px;font-weight:500}
.doc{padding:32px 16px 64px}
.page{position:relative;background:#fff;max-width:816px;margin:0 auto 28px;box-shadow:0 1px 0 #d5dbe2,0 18px 44px -22px rgba(11,20,32,.35);padding:84px 80px 76px;overflow:hidden}
@media (min-width:860px){.page{aspect-ratio:8.5/11}}
.wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;z-index:0}
.wm span{transform:rotate(-32deg);font-size:150px;font-weight:600;letter-spacing:.04em;color:rgba(62,110,158,.06);white-space:nowrap}
.page>*:not(.wm){position:relative;z-index:1}
.rh,.rf{position:absolute!important;left:80px;right:80px;display:flex;justify-content:space-between;gap:12px;font-size:10px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
.rh{top:36px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.rf{bottom:32px;padding-top:8px;border-top:1px solid var(--line)}
.rh b,.rf b{font-weight:600;color:var(--ink)}
h1,h2,h3,h4{color:var(--ink);font-weight:600;letter-spacing:-.01em;margin:0}
h2{font-size:19px;line-height:1.25;margin:30px 0 12px;display:flex;align-items:baseline;gap:12px;padding-bottom:9px;border-bottom:1.5px solid var(--ink)}
.page>h2:first-of-type,.page>.rh+h2{margin-top:0}
h2 .n{color:var(--steel);font-size:15px;min-width:18px}
h3{font-size:14px;margin:22px 0 10px}
h4{font-size:13.5px;line-height:1.35}
p{margin:0 0 10px}
.note{font-size:12.5px;color:var(--slate);margin-top:12px;padding-left:12px;border-left:2px solid var(--line)}
.tbl{width:100%;overflow-x:auto;margin:10px 0 6px;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:12px;line-height:1.45;table-layout:fixed}
thead th{text-align:left;font-weight:600;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:#fff;background:var(--ink);padding:8px 9px;vertical-align:bottom}
tbody td{padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--body)}
tbody tr:nth-child(even) td{background:#f7f9fb}
tbody td:first-child{font-weight:600;color:var(--ink)}
.hash{font-size:10px;color:var(--ink);letter-spacing:.01em;white-space:nowrap}
.sm{font-size:11px;color:var(--slate)}
table.coc td:first-child{white-space:nowrap}
table.tl td:nth-child(-n+2){white-space:nowrap}
table.tl tbody tr:nth-child(even) td{background:none}
.notice{margin-top:40px;padding:22px 24px 12px;background:var(--mist);border-top:1.5px solid var(--ink)}
.notice h3{margin:0 0 10px;font-size:13px;letter-spacing:.04em;text-transform:uppercase}
.notice p{font-size:12.5px;line-height:1.6}
.kf{display:grid;grid-template-columns:repeat(4,1fr);margin:18px 0 22px;border-top:1.5px solid var(--ink);border-bottom:1px solid var(--line)}
.kf>div{padding:14px 14px 14px 0}
.kf>div+div{padding-left:14px;border-left:1px solid var(--line)}
.kf b{display:block;font-size:24px;font-weight:600;color:var(--ink);letter-spacing:-.02em;line-height:1.1}
.kf span{display:block;margin-top:6px;font-size:11.5px;line-height:1.4;color:var(--slate)}
.conf{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:2px;white-space:nowrap;line-height:1.3}
.conf-high{background:#0b1420;color:#fff}
.conf-moderate{background:#dce7f2;color:#173a5e}
.conf-low{background:#fff;color:var(--slate);box-shadow:inset 0 0 0 1px #c3ccd6}
/* cover */
.cover{display:flex;flex-direction:column}
.cv-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.logo{width:150px;height:auto;display:block}
.cv-priv{text-align:right;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink);font-weight:600;line-height:1.6;border-right:3px solid var(--steel);padding-right:12px}
.cv-main{margin-top:120px;border-top:3px solid var(--ink);padding-top:26px}
.cv-kind{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--steel);font-weight:600}
.cv-title{font-size:34px;line-height:1.14;letter-spacing:-.02em;margin-top:16px;max-width:600px}
.cv-sub{font-size:15px;color:var(--slate);margin-top:16px}
.cv-meta{margin:56px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:0 40px;border-top:1px solid var(--line)}
.cv-meta div{padding:12px 0;border-bottom:1px solid var(--line)}
.cv-meta dt{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
.cv-meta dd{margin:4px 0 0;font-size:13.5px;color:var(--ink);font-weight:500}
.cv-foot{margin-top:auto;padding-top:32px;font-size:11px;color:var(--slate)}
.cv-foot p{margin:0 0 6px;max-width:none}
.cv-foot b{color:var(--ink)}
/* toc */
.toc-h{border-bottom:1.5px solid var(--ink)}
.toc{list-style:none;margin:0 0 8px;padding:0;font-size:13px}
.toc li{display:flex;align-items:baseline;gap:12px;padding:5px 0}
.toc li span{color:var(--steel);font-weight:600;min-width:18px}
.toc li i{flex:1;border-bottom:1px dotted #b9c2cc;transform:translateY(-4px)}
.toc li b{font-weight:500;color:var(--ink)}
table.sum td:nth-child(3){color:var(--ink)}
/* questions + limitations */
.qs,.lim{list-style:none;margin:6px 0 12px;padding:0}
.qs li,.lim li{display:flex;gap:14px;padding:8px 0;border-bottom:1px solid var(--line)}
.qs li:first-child{border-top:1px solid var(--line)}
.qs li span,.lim li span{flex:none;width:30px;font-weight:600;color:var(--steel)}
.lim li{border:0;padding:5px 0}
/* steps */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin:16px 0 4px;border-top:1.5px solid var(--ink)}
.steps>div{padding:14px 14px 4px 0}
.steps>div+div{padding-left:14px;border-left:1px solid var(--line)}
.steps span{font-size:11px;font-weight:600;color:var(--steel);letter-spacing:.04em}
.steps h4{margin:6px 0 6px}
.steps p{font-size:12px;line-height:1.5;color:var(--slate)}
/* findings */
.fds{display:grid;gap:8px;margin-top:10px}
.fd{border:1px solid var(--line);border-left:3px solid var(--ink);padding:11px 16px 9px}
.fd-h{display:flex;align-items:flex-start;gap:12px}
.fd-h h4{flex:1}
.fd-n{font-weight:600;color:var(--steel);font-size:13px;min-width:22px}
.fd p{font-size:12px;line-height:1.5;margin:5px 0 3px 34px}
.fd-x{margin-left:34px;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
/* signature */
.sig{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin-top:34px}
.sig>div{display:flex;flex-direction:column;font-size:12px;color:var(--slate)}
.sig-line{height:42px;border-bottom:1px solid var(--ink);margin-bottom:8px}
.sig b{color:var(--ink);font-size:13px}
.end{margin-top:34px;text-align:center;font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--slate)}
/* phones */
@media (max-width:640px){
  body{font-size:15px}
  .doc{padding:16px 0 40px}
  .page{padding:64px 20px 64px;margin-bottom:14px;box-shadow:0 1px 0 #d5dbe2}
  .rh,.rf{left:20px;right:20px;font-size:9.5px}
  .rh{top:20px}.rf{bottom:20px}
  .rh span:first-child{display:none}
  .wm span{font-size:84px}
  .cv-main{margin-top:56px}
  .cv-title{font-size:27px}
  .cv-meta{grid-template-columns:1fr;margin-top:36px}
  .cv-foot{padding-top:40px}
  .steps{grid-template-columns:1fr 1fr}
  .steps>div:nth-child(3){padding-left:0;border-left:0}
  .steps>div{border-bottom:1px solid var(--line);padding-bottom:10px}
  table{font-size:12.5px}
  .kf{grid-template-columns:1fr 1fr}.kf>div:nth-child(3){padding-left:0;border-left:0}.kf>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .notice{padding:18px 16px 8px}
  .tbl{overflow:visible}
  table,tbody,tr,td{display:block;width:100%!important}
  colgroup,thead{display:none}
  table{border-top:1.5px solid var(--ink)}
  tbody tr{padding:10px 0;border-bottom:1px solid var(--line)}
  tbody tr:nth-child(even) td{background:none}
  tbody td{border:0;padding:3px 0;white-space:normal!important;display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:13.5px}
  tbody td::before{content:attr(data-label);font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--slate);padding-top:2px}
  tbody td:empty{display:none}
  .hash{white-space:normal;word-break:break-all;font-size:11.5px}
  .hash br{display:none}
  .fd p,.fd-x{margin-left:0}
  .fd-h{flex-wrap:wrap}.fd-h .conf{margin-left:34px}
  .sig{grid-template-columns:1fr;gap:16px}
  .bar .lab{display:none}
}
/* print = Letter pages */
@page{size:letter;margin:0}
@media print{
  html,body{background:#fff}
  .bar{display:none}
  .doc{padding:0}
  .page{width:8.5in;height:11in;max-width:none;aspect-ratio:auto;margin:0;box-shadow:none;page-break-after:always;break-after:page}
  .page:last-child{page-break-after:auto;break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* request panel (public previews) */
.req{max-width:816px;margin:0 auto 28px;background:#0b1420;color:#c9d3de;padding:44px 56px 46px;position:relative}
.req .k{font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:#8fb0cf;font-weight:600}
.req h2{color:#fff;border:0;padding:0;margin:12px 0 12px;font-size:24px;display:block}
.req p{font-size:14px;line-height:1.6;max-width:560px;color:rgba(255,255,255,.75)}
.req a.btn{display:inline-flex;align-items:center;gap:10px;margin-top:14px;background:#fff;color:#0b1420;text-decoration:none;font-weight:600;font-size:14px;padding:0 20px;min-height:46px;border-radius:2px}
.req a.btn:hover{background:#dce7f2}
.bar .rq{border:1px solid rgba(255,255,255,.35);padding:0 14px;border-radius:2px;font-weight:500}
@media (max-width:640px){.req{padding:32px 20px 34px}.req h2{font-size:21px}}
/* letter */
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
.lh .logo{width:150px}
.lh-ad{text-align:right;font-size:11px;line-height:1.6;color:var(--slate)}
.lh-ad b{color:var(--ink);font-weight:600}
.lt-meta{display:flex;justify-content:space-between;gap:20px;margin-top:34px;font-size:12.5px;color:var(--slate)}
.lt-meta b{color:var(--ink);font-weight:600}
.lt-to{margin-top:22px;font-size:13.5px;line-height:1.55;color:var(--ink)}
.lt-conf{font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;font-weight:600;color:var(--ink);margin-top:26px}
.lt-re{margin-top:22px;padding:12px 0 12px 14px;border-left:3px solid var(--steel)}
.lt-re .t{font-size:20px;font-weight:600;color:var(--ink);letter-spacing:-.01em}
.lt-re .s{font-size:13.5px;color:var(--slate);margin-top:3px}
.lt p{font-size:13.5px;line-height:1.62;margin:0 0 11px}
.lt .num{display:flex;gap:12px}.lt .num>span:first-child{flex:none;width:22px;color:var(--steel);font-weight:600}
.att{list-style:none;margin:4px 0 14px 34px;padding:0;border-top:1px solid var(--line)}
.att li{display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;line-height:1.55}
.att li>span:first-child{flex:none;width:26px;font-weight:600;color:var(--steel)}
.att li b{color:var(--ink);font-weight:600}
.lt-sig{margin-top:30px;width:300px;font-size:13px;color:var(--slate)}
.lt-sig .yt{color:var(--ink);margin-bottom:6px}
.lt-sig .sl{height:58px;border-bottom:1px solid var(--ink);margin-bottom:8px}
.lt-sig b{display:block;color:var(--ink);font-weight:600}
.lt-enc{margin-top:26px;font-size:11.5px;color:var(--slate);padding-top:10px;border-top:1px solid var(--line)}
.res{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.res-ok{color:#173a5e}
.wm.long span{font-size:150px;line-height:1;text-align:center;color:rgba(62,110,158,.085)}
.lim.w li span{width:46px}
.wm.long small{display:block;font-size:34px;letter-spacing:.04em;text-transform:uppercase;margin-top:14px;color:rgba(62,110,158,.16)}
@media (max-width:640px){.wm.long small{font-size:20px}}
@media (max-width:640px){.lh{flex-direction:column;align-items:flex-start}.lh-ad{text-align:left}.lt-meta{flex-direction:column;gap:4px}.lt-sig{width:100%}}

.pimg{display:block;width:100%;max-width:816px;height:auto;margin:0 auto 28px;background:#fff;box-shadow:0 1px 0 #d5dbe2,0 18px 44px -22px rgba(11,20,32,.35);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (max-width:640px){.pimg{margin-bottom:14px}}
</style>
</head>
<body>

</body>
</html>
